name: Fiscal
options:
  bundleIdPrefix: com.linotsai
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.6"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 38
targets:
  FiscalKit:
    type: framework
    platform: [iOS, macOS]
    sources: Sources/FiscalKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal.kit
        DEFINES_MODULE: YES
  FiscaliOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
        excludes:
          - V15Gallery
          - V15RootSmoke
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Fiscal
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        FISCAL_API_BASE_URL: "$(FISCAL_API_BASE_URL)"
        NSPhotoLibraryUsageDescription: "Fiscal 读取你允许访问的截图，在设备端识别记账文字；图片不会上传。"
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - fiscal
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
    dependencies:
      - target: FiscalKit_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal
        PRODUCT_NAME: Fiscal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: HX73DFL88G
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Debug:
          FISCAL_API_BASE_URL: "http://127.0.0.1:8000"
        Release:
          FISCAL_API_BASE_URL: "https://fiscal.linotsai.top"
  FiscalmacOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
        excludes:
          - V15Gallery
          - V15RootSmoke
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: Fiscal
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        FISCAL_API_BASE_URL: "$(FISCAL_API_BASE_URL)"
        LSApplicationCategoryType: public.app-category.finance
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - fiscal
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: FiscalKit_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal.mac
        PRODUCT_NAME: Fiscal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          FISCAL_API_BASE_URL: "http://127.0.0.1:8000"
        Release:
          FISCAL_API_BASE_URL: "https://fiscal.linotsai.top"
          DEVELOPMENT_TEAM: HX73DFL88G
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
  V15GalleryiOS:
    type: application
    platform: iOS
    sources: Apps/iOS/V15Gallery
    info:
      path: Apps/iOS/V15Gallery/Info.plist
      properties:
        CFBundleDisplayName: Fiscal V15 Gallery
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
    dependencies:
      - target: FiscalKit_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal.v15-gallery.ios
        PRODUCT_NAME: Fiscal V15 Gallery iOS
        CODE_SIGN_STYLE: Automatic
  V15GallerymacOS:
    type: application
    platform: macOS
    sources: Apps/macOS/V15Gallery
    info:
      path: Apps/macOS/V15Gallery/Info.plist
      properties:
        CFBundleDisplayName: Fiscal V15 Gallery
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    dependencies:
      - target: FiscalKit_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal.v15-gallery.macos
        PRODUCT_NAME: Fiscal V15 Gallery macOS
        CODE_SIGN_STYLE: Automatic
  V15RootSmokeiOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS/V15RootSmoke
      - Apps/iOS/IOSRootView.swift
    info:
      path: Apps/iOS/V15RootSmoke/Info.plist
      properties:
        CFBundleDisplayName: Fiscal V15 Root Smoke
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        FISCAL_API_BASE_URL: "$(FISCAL_API_BASE_URL)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
    dependencies:
      - target: FiscalKit_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal.v15-root-smoke.ios
        PRODUCT_NAME: Fiscal V15 Root Smoke iOS
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          FISCAL_API_BASE_URL: "http://127.0.0.1:8000"
  V15RootSmokemacOS:
    type: application
    platform: macOS
    sources:
      - Apps/macOS/V15RootSmoke
      - Apps/macOS/MacRootView.swift
    info:
      path: Apps/macOS/V15RootSmoke/Info.plist
      properties:
        CFBundleDisplayName: Fiscal V15 Root Smoke
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        FISCAL_API_BASE_URL: "$(FISCAL_API_BASE_URL)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: FiscalKit_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal.v15-root-smoke.macos
        PRODUCT_NAME: Fiscal V15 Root Smoke macOS
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          FISCAL_API_BASE_URL: "http://127.0.0.1:8000"
  V15GalleryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/V15GalleryUITests
    dependencies:
      - target: V15GalleryiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal.v15-gallery.ui-tests
  V15GallerymacOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: Tests/V15GallerymacOSUITests
    dependencies:
      - target: V15GallerymacOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal.v15-gallery.macos-ui-tests
  V15RootSmokeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/V15RootSmokeUITests
    dependencies:
      - target: V15RootSmokeiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal.v15-root-smoke.ios-ui-tests
  V15RootSmokemacOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: Tests/V15RootSmokemacOSUITests
    dependencies:
      - target: V15RootSmokemacOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal.v15-root-smoke.macos-ui-tests
  FiscalKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests/FiscalKitTests
    dependencies:
      - target: FiscalKit_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal.kit.tests
  V15GallerySnapshotTool:
    type: tool
    platform: macOS
    sources: Tests/V15GallerySnapshotTool
    dependencies:
      - target: FiscalKit_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linotsai.fiscal.v15-gallery-snapshot-tool
schemes:
  FiscaliOS:
    build:
      targets:
        FiscaliOS: all
    run:
      # Device installs happen via plain Xcode Run; Release keeps them pointed at the
      # production base URL instead of the Debug localhost that stranded v1.2.4(18) installs.
      # Local-backend iOS development should use a temporary scheme override, not this default.
      config: Release
  FiscalmacOS:
    build:
      targets:
        FiscalmacOS: all
    run:
      config: Debug
    test:
      targets:
        - FiscalKitTests
      environmentVariables:
        FISCAL_UI_TEST_ACCESS_KEY: fiscal_ak_v1_integration_test_access_key_0123456789abcdef
        FISCAL_QA_SCREENSHOT_DIR: "$(SRCROOT)/../archive/releases/v1.0-v1.3/qa/p10/screenshots"
  V15GalleryiOS:
    build:
      targets:
        V15GalleryiOS: all
    run:
      config: Debug
    test:
      targets:
        - V15GalleryUITests
  V15GallerymacOS:
    build:
      targets:
        V15GallerymacOS: all
    run:
      config: Debug
    test:
      targets:
        - V15GallerymacOSUITests
  V15RootSmokeiOS:
    build:
      targets:
        V15RootSmokeiOS: all
    run:
      config: Debug
    test:
      targets:
        - V15RootSmokeUITests
  V15RootSmokemacOS:
    build:
      targets:
        V15RootSmokemacOS: all
    run:
      config: Debug
    test:
      targets:
        - V15RootSmokemacOSUITests
