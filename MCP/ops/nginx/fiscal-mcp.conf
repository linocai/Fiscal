# Install as a separate HZ Nginx site. The MCP process never listens publicly;
# only this virtual host exposes it through TLS.

limit_req_zone $binary_remote_addr zone=fiscal_mcp_api:10m rate=5r/s;

upstream fiscal_mcp_backend {
    server 127.0.0.1:8050;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.fiscal.linotsai.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.fiscal.linotsai.top;

    ssl_certificate /etc/letsencrypt/live/mcp.fiscal.linotsai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.fiscal.linotsai.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:FiscalMCP_TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;
    limit_req_status 429;
    access_log /var/log/nginx/fiscal-mcp.access.log;
    error_log /var/log/nginx/fiscal-mcp.error.log warn;

    location = /health {
        proxy_pass http://fiscal_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 5s;
    }

    location ^~ /auth/ {
        limit_req zone=fiscal_mcp_api burst=20 nodelay;
        proxy_pass http://fiscal_mcp_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Fiscal-Poll-Token $http_x_fiscal_poll_token;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 30s;
    }

    location = /mcp {
        limit_req zone=fiscal_mcp_api burst=20 nodelay;
        proxy_pass http://fiscal_mcp_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 75s;
    }

    location / {
        return 404;
    }
}
