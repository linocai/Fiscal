# Static Fiscal Ledger Console on HZ.
# The browser stays same-origin: /api/ is proxied to the NB Fiscal API so the
# console does not require a public CORS allowlist or expose a second writer.

upstream fiscal_web_backend {
    server fiscal.linotsai.top:443;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name console.fiscal.linotsai.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.fiscal.linotsai.top;

    ssl_certificate /etc/letsencrypt/live/console.fiscal.linotsai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.fiscal.linotsai.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:FiscalWeb_TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # The approval page must never be framed (clickjacking).
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;

    root /opt/fiscal-web/current/dist;
    index index.html;
    client_max_body_size 2m;
    access_log /var/log/nginx/fiscal-web.access.log;
    error_log /var/log/nginx/fiscal-web.error.log warn;

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass https://fiscal_web_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name fiscal.linotsai.top;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host fiscal.linotsai.top;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
