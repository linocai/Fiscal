<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>批准 Fiscal Agent 操作</title>
  <style>
    :root { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f4f7f3; color:#17352b; }
    main { max-width:520px; margin:72px auto; padding:0 22px; } .card { background:#fff; border:1px solid #dfe9e1; border-radius:18px; padding:28px; box-shadow:0 6px 24px #17352b0d; }
    h1 { margin-top:0; font-size:25px; } label { display:block; margin:20px 0 8px; font-weight:600; }
    input { width:100%; box-sizing:border-box; border:1px solid #b9cabd; border-radius:9px; padding:12px; font-size:20px; letter-spacing:5px; }
    button { margin-top:20px; border:0; border-radius:9px; padding:12px 18px; background:#1d7254; color:#fff; font-size:16px; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; } #message { margin-top:18px; line-height:1.5; white-space:pre-wrap; }
    .error { color:#a6372e; } .ok { color:#1d7254; }
  </style>
</head>
<body>
<main><div class="card">
  <h1>批准 Fiscal Agent 操作</h1>
  <p>确认这是你刚刚发起的 Fiscal Agent 请求后，输入 Google Authenticator 当前的 6 位验证码。</p>
  <form id="form">
    <label for="code">Authenticator 验证码</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
    <button id="submit" type="submit">批准</button>
  </form>
  <div id="message" role="status"></div>
</div></main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const challenge = params.get('challenge') || '';
  const endpoint = 'https://mcp.fiscal.linotsai.top';
  const form = document.getElementById('form');
  const input = document.getElementById('code');
  const button = document.getElementById('submit');
  const message = document.getElementById('message');
  if (!/^[A-Za-z0-9_-]{20,160}$/.test(challenge)) {
    form.hidden = true;
    message.className = 'error';
    message.textContent = '批准链接无效或不完整，请让 Agent 重新创建 challenge。';
    return;
  }
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const code = input.value.trim();
    if (!/^\d{6}$/.test(code)) { message.className = 'error'; message.textContent = '请输入 6 位数字验证码。'; return; }
    button.disabled = true; message.className = ''; message.textContent = '正在验证…';
    try {
      const response = await fetch(`${endpoint}/auth/challenges/${encodeURIComponent(challenge)}/approve`, {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({totp: code})
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data?.error?.message || data?.message || '验证码无效或 challenge 已过期。');
      form.hidden = true; message.className = 'ok'; message.textContent = '已批准。请回到 Agent，等待它完成轮询。';
    } catch (error) {
      button.disabled = false; message.className = 'error'; message.textContent = error instanceof Error ? error.message : '批准失败。';
    }
  });
})();
</script>
</body>
</html>
