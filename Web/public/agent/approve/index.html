<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>批准 Fiscal Agent</title>
  <style>
    :root { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f4f7f3; color:#17352b; }
    main { max-width:560px; margin:56px auto; padding:0 16px; }
    h1 { font-size:25px; margin:0 0 6px; } .lead { margin:0 0 20px; color:#4a6358; line-height:1.55; }
    .card { background:#fff; border:1px solid #dfe9e1; border-radius:18px; padding:22px 24px; margin:14px 0; box-shadow:0 6px 24px #17352b0d; }
    .empty { text-align:center; color:#4a6358; }
    .kind { display:inline-block; font-size:13px; font-weight:600; padding:3px 10px; border-radius:999px; background:#e3efe7; color:#1d7254; }
    .kind.write { background:#fbeedd; color:#94570f; }
    .pair { font-size:30px; font-weight:700; letter-spacing:6px; margin:12px 0 4px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    .meta { color:#4a6358; font-size:14px; line-height:1.6; margin:6px 0 0; overflow-wrap:anywhere; }
    form { display:flex; gap:10px; margin-top:16px; }
    input { flex:1; min-width:0; border:1px solid #b9cabd; border-radius:9px; padding:11px 12px; font-size:20px; letter-spacing:5px; }
    button { border:0; border-radius:9px; padding:11px 18px; background:#1d7254; color:#fff; font-size:16px; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .msg { margin-top:10px; font-size:14px; } .error { color:#a6372e; } .ok { color:#1d7254; }
  </style>
</head>
<body>
<main>
  <h1>批准 Fiscal Agent</h1>
  <p class="lead">把这个页面加入书签。Agent 发起申请后，申请会自动出现在这里；只批准<strong>配对码与 Agent 告诉你的一致</strong>的那一条。</p>
  <div id="list" aria-live="polite"><div class="card empty">正在读取…</div></div>
  <p id="done" class="msg ok" role="status"></p>
</main>
<script>
(() => {
  const endpoint = 'https://mcp.fiscal.linotsai.top';
  const list = document.getElementById('list');
  const done = document.getElementById('done');
  const kinds = {
    session: ['开始会话', '允许该 Agent 读取、分析和暂存账单（空闲 2 小时失效，最长 8 小时）。', ''],
    write_window: ['开启写入窗口', '批准后 30 分钟内，该 Agent 可直接提交账本，无需再次批准。', 'write'],
  };
  let shown = null;
  const messages = {
    invalid_totp: '验证码不正确或已过期，请输入当前的 6 位验证码。',
    totp_reused: '这个验证码刚用过，请等下一个验证码（约 30 秒）再批准。',
    challenge_expired: '申请已过期或已撤销，请让 Agent 重新发起。',
    auth_rate_limited: '尝试次数过多，请几分钟后再试。',
    session_expired: '发起这个申请的会话已失效，请让 Agent 重新开始会话。',
  };
  let busy = false;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function render(items) {
    const signature = items.map((item) => item.challenge_id).join(',');
    if (signature === shown) return;
    shown = signature;
    list.replaceChildren();
    if (!items.length) {
      list.append(el('div', 'card empty', '当前没有待批准的申请。Agent 发起后会自动出现。'));
      return;
    }
    for (const item of items) {
      const [title, explain, tone] = kinds[item.kind] || [item.kind, '', ''];
      const card = el('div', 'card');
      card.append(el('span', `kind ${tone}`, title));
      card.append(el('div', 'pair', item.pairing_code));
      card.append(el('p', 'meta', explain));
      card.append(el('p', 'meta', `来自：${item.client_label || 'agent'}${item.intent ? ` · ${item.intent}` : ''}`));
      card.append(el('p', 'meta', `有效至 ${new Date(item.expires_at).toLocaleTimeString('zh-CN', {hour12: false})}`));
      const form = el('form');
      const input = el('input');
      Object.assign(input, {inputMode: 'numeric', autocomplete: 'one-time-code', maxLength: 6, required: true, placeholder: '6 位验证码'});
      input.setAttribute('aria-label', `配对码 ${item.pairing_code} 的 Authenticator 验证码`);
      const button = el('button', '', '批准');
      button.type = 'submit';
      const message = el('div', 'msg');
      form.append(input, button);
      card.append(form, message);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const code = input.value.trim();
        if (!/^\d{6}$/.test(code)) { message.className = 'msg error'; message.textContent = '请输入 6 位数字验证码。'; return; }
        busy = true; button.disabled = true; message.className = 'msg'; message.textContent = '正在验证…';
        try {
          const response = await fetch(`${endpoint}/auth/challenges/${encodeURIComponent(item.challenge_id)}/approve`, {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({totp: code}),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(messages[data?.error?.code] || data?.error?.message || '验证码无效或申请已过期。');
          done.textContent = `已批准配对码 ${item.pairing_code}（${title}）。请回到 Agent。`;
          shown = null;
        } catch (error) {
          button.disabled = false;
          message.className = 'msg error';
          message.textContent = error instanceof Error ? error.message : '批准失败。';
        } finally {
          busy = false;
          refresh();
        }
      });
      list.append(card);
    }
  }

  async function refresh() {
    if (busy || list.contains(document.activeElement) && document.activeElement.value) return;
    try {
      const response = await fetch(`${endpoint}/auth/challenges/pending`, {cache: 'no-store'});
      if (!response.ok) throw new Error();
      const data = await response.json();
      render(Array.isArray(data.items) ? data.items : []);
    } catch {
      shown = null;
      list.replaceChildren(el('div', 'card empty error', '暂时无法连接 Fiscal，稍后自动重试。'));
    }
  }

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
